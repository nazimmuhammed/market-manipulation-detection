version: "3.9"
services:
  postgres:
    image: timescale/timescaledb:latest-pg15
    environment:
      POSTGRES_USER: mmd
      POSTGRES_PASSWORD: mmd_pass
      POSTGRES_DB: mmd_db
    ports: ["5432:5432"]
    volumes: ["pg_data:/var/lib/postgresql/data"]

  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: neo4j/mmd_pass123
    ports: ["7474:7474", "7687:7687"]
    volumes: ["neo4j_data:/data"]

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

volumes:
  pg_data:
  neo4j_data: